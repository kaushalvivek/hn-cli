name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Build universal binary
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Package release assets
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist
          cp .build/apple/Products/Release/hn dist/hn
          cp LICENSE dist/LICENSE
          cp README.md dist/README.md
          chmod 755 dist/hn

          codesign --force --sign - dist/hn
          codesign --verify --verbose dist/hn

          VERSIONED="hn-${TAG}-macos-universal.tar.gz"
          tar -czf "$VERSIONED" -C dist hn LICENSE README.md
          cp "$VERSIONED" hn-macos-universal.tar.gz

          shasum -a 256 "$VERSIONED" hn-macos-universal.tar.gz > checksums.txt
          cat checksums.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            hn-*-macos-universal.tar.gz
            hn-macos-universal.tar.gz
            checksums.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
